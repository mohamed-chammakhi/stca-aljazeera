ssage</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.8311" x="71.7502" y="456.8936">Example: "Veuillez saisir un email valide"</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="1979.0869" y1="470.75" y2="470.75"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="86.7861" x="15" y="482.1689">[Valid form data]</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg7"><polygon fill="#181818" points="543.7266,552.9922,553.7266,556.9922,543.7266,560.9922,547.7266,556.9922" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1.2;" x1="322.5522" x2="549.7266" y1="556.9922" y2="556.9922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5044" x="366.8872" y="503.0811">7. login(email, password)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.3608" x="404.459" y="519.4326">Dart values:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.249" x="403.0149" y="535.7842">email: String</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.8208" x="390.729" y="552.1357">password: String</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg8"><polygon fill="#181818" points="800.3745,599.6953,810.3745,603.6953,800.3745,607.6953,804.3745,603.6953" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1.2;" x1="555.7266" x2="806.3745" y1="603.6953" y2="603.6953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.5044" x="611.7983" y="582.4873">8. login(email, password)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength