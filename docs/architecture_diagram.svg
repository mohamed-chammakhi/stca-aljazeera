<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1A2E1F"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#1A2E1F}
      .sub{font-size:13px;fill:#5a6155}
      .tier{font-size:12px;font-weight:700;fill:#888;letter-spacing:2px}
      .box-t{font-size:17px;font-weight:700;fill:#fff}
      .box-s{font-size:12px;fill:#eef}
      .lyr-t{font-size:15px;font-weight:700;fill:#1A2E1F}
      .lyr-s{font-size:11.5px;fill:#5a6155}
      .lbl{font-size:12px;font-weight:600;fill:#1A2E1F}
      .lbl-bg{fill:#fff;stroke:#d8ddd5}
      .mono{font-family:Consolas,monospace;font-size:11px;fill:#38835A}
    </style>
  </defs>

  <rect width="1100" height="760" fill="#F7F4EC"/>
  <text x="50" y="50" class="title">Architecture du système — Al Jazeera STCA</text>
  <text x="50" y="74" class="sub">Architecture client-serveur 3-tiers · Application en couches (Modèle–Service–Vue)</text>

  <!-- TIER 1 : FLUTTER -->
  <text x="50" y="120" class="tier">TIER 1 — PRÉSENTATION (CLIENT MOBILE)</text>
  <rect x="50" y="132" width="1000" height="170" rx="12" fill="#eef3ef" stroke="#cdd8d0"/>
  <text x="70" y="160" class="lyr-t">Application Flutter</text>
  <text x="70" y="180" class="lyr-s">4 modules de rôle : Directeur · Collecteur · Dégustateur · Technicien Labo</text>

  <!-- 3 couches -->
  <rect x="70" y="195" width="295" height="90" rx="9" fill="#fff" stroke="#38835A" stroke-width="2"/>
  <text x="86" y="222" class="lyr-t">Vue</text>
  <text x="86" y="243" class="lyr-s">widgets/ · *_page.dart</text>
  <text x="86" y="262" class="lyr-s">Affichage UI, capture des actions</text>

  <rect x="385" y="195" width="295" height="90" rx="9" fill="#fff" stroke="#C9A23B" stroke-width="2"/>
  <text x="401" y="222" class="lyr-t">Service</text>
  <text x="401" y="243" class="lyr-s">services/</text>
  <text x="401" y="262" class="lyr-s">Logique, appels API, état</text>

  <rect x="700" y="195" width="330" height="90" rx="9" fill="#fff" stroke="#3A6EA5" stroke-width="2"/>
  <text x="716" y="222" class="lyr-t">Modèle</text>
  <text x="716" y="243" class="lyr-s">models/</text>
  <text x="716" y="262" class="mono">fromJson() / toJson()</text>

  <!-- internal arrows -->
  <line x1="365" y1="240" x2="383" y2="240" stroke="#1A2E1F" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="680" y1="240" x2="698" y2="240" stroke="#1A2E1F" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- ARROW TIER1 <-> TIER2 -->
  <line x1="550" y1="302" x2="550" y2="372" stroke="#1A2E1F" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <rect x="600" y="318" width="300" height="38" rx="8" class="lbl-bg"/>
  <text x="615" y="335" class="lbl">HTTP / REST</text>
  <text x="615" y="350" class="mono">requête + réponse en JSON · token JWT</text>

  <!-- TIER 2 : DJANGO -->
  <text x="50" y="398" class="tier">TIER 2 — LOGIQUE MÉTIER (SERVEUR)</text>
  <rect x="50" y="410" width="1000" height="150" rx="12" fill="#38835A"/>
  <text x="70" y="440" class="box-t">API Django REST Framework</text>
  <text x="70" y="461" class="box-s">Patron MVT adapté en API REST</text>

  <rect x="70" y="478" width="300" height="62" rx="9" fill="rgba(255,255,255,.14)"/>
  <text x="86" y="503" class="box-t" font-size="14">View</text>
  <text x="86" y="523" class="box-s">Endpoints, permissions par rôle</text>

  <rect x="390" y="478" width="300" height="62" rx="9" fill="rgba(255,255,255,.14)"/>
  <text x="406" y="503" class="box-t" font-size="14">Serializer</text>
  <text x="406" y="523" class="box-s">Validation, JSON ⇄ objets</text>

  <rect x="710" y="478" width="320" height="62" rx="9" fill="rgba(255,255,255,.14)"/>
  <text x="726" y="503" class="box-t" font-size="14">Model (ORM)</text>
  <text x="726" y="523" class="box-s">Règles métier, états d'échantillon</text>

  <!-- ARROW TIER2 <-> TIER3 -->
  <line x1="550" y1="560" x2="550" y2="624" stroke="#1A2E1F" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <rect x="600" y="572" width="300" height="38" rx="8" class="lbl-bg"/>
  <text x="615" y="589" class="lbl">SQL</text>
  <text x="615" y="604" class="mono">requêtes ORM · lignes de données</text>

  <!-- TIER 3 : DB -->
  <text x="50" y="650" class="tier">TIER 3 — DONNÉES (STOCKAGE)</text>
  <rect x="50" y="662" width="1000" height="78" rx="12" fill="#1A2E1F"/>
  <text x="70" y="693" class="box-t">Base de données PostgreSQL</text>
  <text x="70" y="715" class="box-s">Utilisateurs · Échantillons · Évaluations · Analyses · Notifications — accès exclusif via Django</text>
</svg>
