<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 930" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#38835A"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2E6F9F"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:800;fill:#1A2E1F}
      .subtitle{font-size:15px;fill:#5d6b61}
      .zoneTitle{font-size:16px;font-weight:800;letter-spacing:1.5px;fill:#1A2E1F}
      .boxTitle{font-size:16px;font-weight:800;fill:#1A2E1F}
      .boxText{font-size:13px;fill:#5d6b61}
      .small{font-size:12px;fill:#5d6b61}
      .mono{font-family:Consolas,monospace;font-size:12px;fill:#2E6F9F}
      .monoGreen{font-family:Consolas,monospace;font-size:12px;fill:#38835A}
      .label{font-size:13px;font-weight:700;fill:#1A2E1F}
      .whiteTitle{font-size:17px;font-weight:800;fill:#fff}
      .whiteText{font-size:13px;fill:#eaf5ee}
      .note{font-size:12px;fill:#6b5a35}
    </style>
  </defs>

  <rect width="1300" height="930" fill="#F6F7F4"/>

  <text x="55" y="55" class="title">Project Architecture - Al Jazeera STCA</text>
  <text x="55" y="82" class="subtitle">A beginner map of where the code lives and how data travels through the Flutter + Django project.</text>

  <!-- top explanation -->
  <rect x="55" y="105" width="1190" height="62" rx="15" fill="#E7F2EC" stroke="#B9D8C6"/>
  <text x="78" y="132" class="label">Read this graph from left to right:</text>
  <text x="270" y="132" class="small">Screen action -> Flutter service -> API client -> Django endpoint -> serializer/model -> database -> response back to the screen.</text>
  <text x="78" y="153" class="small">The important rule: pages do not talk to the database. Pages call services. Services call ApiClient. Django is the only side that touches PostgreSQL.</text>

  <!-- Flutter zone -->
  <rect x="55" y="205" width="560" height="545" rx="22" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="2"/>
  <text x="80" y="235" class="zoneTitle">FLUTTER MOBILE APP</text>
  <text x="80" y="258" class="mono">lib/</text>
  <text x="122" y="258" class="small">client side: interface, local state, services, models</text>

  <!-- role folders -->
  <rect x="82" y="285" width="506" height="92" rx="14" fill="#E8F1F8" stroke="#9FC1DB"/>
  <text x="105" y="312" class="boxTitle">1. Role modules</text>
  <text x="105" y="336" class="boxText">Each main user role has its own Flutter folder.</text>
  <text x="105" y="359" class="mono">1_ceo/  2_collecteur/  3_degustateur/  4_laboratoire/  5_chef_degustateur/</text>

  <!-- presentation -->
  <rect x="82" y="405" width="235" height="115" rx="14" fill="#FFFFFF" stroke="#2E6F9F" stroke-width="2"/>
  <text x="105" y="433" class="boxTitle">2. Presentation</text>
  <text x="105" y="457" class="boxText">Pages, cards, drawers, dialogs.</text>
  <text x="105" y="481" class="mono">*_page.dart</text>
  <text x="105" y="501" class="mono">widgets/</text>

  <!-- models -->
  <rect x="353" y="405" width="235" height="115" rx="14" fill="#FFFFFF" stroke="#A66F1A" stroke-width="2"/>
  <text x="376" y="433" class="boxTitle">3. Models</text>
  <text x="376" y="457" class="boxText">Dart shape of the data.</text>
  <text x="376" y="481" class="mono">models/</text>
  <text x="376" y="501" class="monoGreen">fromJson() / toJson()</text>

  <!-- services -->
  <rect x="82" y="548" width="235" height="125" rx="14" fill="#FBF0DF" stroke="#DDB974" stroke-width="2"/>
  <text x="105" y="576" class="boxTitle">4. Services</text>
  <text x="105" y="600" class="boxText">Where pages ask for data.</text>
  <text x="105" y="624" class="mono">services/</text>
  <text x="105" y="644" class="small">Example:</text>
  <text x="170" y="644" class="mono">auth_service.dart</text>

  <!-- api client -->
  <rect x="353" y="548" width="235" height="125" rx="14" fill="#E7F2EC" stroke="#95C6AA" stroke-width="2"/>
  <text x="376" y="576" class="boxTitle">5. Shared API client</text>
  <text x="376" y="600" class="boxText">The only HTTP door in Flutter.</text>
  <text x="376" y="624" class="mono">core/api_client.dart</text>
  <text x="376" y="644" class="small">Adds JWT token, sends JSON, reads response.</text>

  <!-- flutter arrows -->
  <line x1="199" y1="520" x2="199" y2="540" stroke="#38835A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="317" y1="610" x2="343" y2="610" stroke="#38835A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M470 548 C470 530 470 530 470 520" fill="none" stroke="#2E6F9F" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="335" y="704" class="small">Flutter rule: UI calls services, services use ApiClient, models translate JSON.</text>

  <!-- HTTP bridge -->
  <line x1="615" y1="610" x2="690" y2="610" stroke="#38835A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="690" y1="650" x2="615" y2="650" stroke="#2E6F9F" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="622" y="545" width="80" height="92" rx="10" fill="#FFFFFF" stroke="#D9DFD8"/>
  <text x="662" y="575" text-anchor="middle" class="label">REST</text>
  <text x="662" y="596" text-anchor="middle" class="mono">JSON</text>
  <text x="662" y="616" text-anchor="middle" class="mono">JWT</text>
  <text x="650" y="674" text-anchor="middle" class="small">response</text>

  <!-- Django zone -->
  <rect x="690" y="205" width="555" height="545" rx="22" fill="#FFFFFF" stroke="#CDD8D0" stroke-width="2"/>
  <text x="715" y="235" class="zoneTitle">DJANGO REST BACKEND</text>
  <text x="715" y="258" class="mono">backend_new/</text>
  <text x="818" y="258" class="small">server side: permissions, validation, business rules, database access</text>

  <!-- backend apps -->
  <rect x="717" y="285" width="501" height="92" rx="14" fill="#E8F1F8" stroke="#9FC1DB"/>
  <text x="740" y="312" class="boxTitle">6. Backend apps</text>
  <text x="740" y="336" class="boxText">Django is split by business domain.</text>
  <text x="740" y="359" class="mono">users/  echantillons/  evaluations/  analyses/  notifications/  sessions_degustation/</text>

  <!-- urls/views -->
  <rect x="717" y="405" width="235" height="115" rx="14" fill="#E7F2EC" stroke="#95C6AA" stroke-width="2"/>
  <text x="740" y="433" class="boxTitle">7. URLs + Views</text>
  <text x="740" y="457" class="boxText">Receive API requests.</text>
  <text x="740" y="481" class="mono">urls.py</text>
  <text x="740" y="501" class="mono">views.py / ViewSet</text>

  <!-- serializers -->
  <rect x="983" y="405" width="235" height="115" rx="14" fill="#FBF0DF" stroke="#DDB974" stroke-width="2"/>
  <text x="1006" y="433" class="boxTitle">8. Serializers</text>
  <text x="1006" y="457" class="boxText">Validate and translate data.</text>
  <text x="1006" y="481" class="mono">serializers.py</text>
  <text x="1006" y="501" class="small">JSON &lt;-&gt; Django object</text>

  <!-- models permissions -->
  <rect x="717" y="548" width="235" height="125" rx="14" fill="#FFFFFF" stroke="#A66F1A" stroke-width="2"/>
  <text x="740" y="576" class="boxTitle">9. Models + ORM</text>
  <text x="740" y="600" class="boxText">Database tables as Python classes.</text>
  <text x="740" y="624" class="mono">models.py</text>
  <text x="740" y="644" class="small">Example: Echantillon, User, Analyse</text>

  <rect x="983" y="548" width="235" height="125" rx="14" fill="#FAE9E9" stroke="#DCAAAA" stroke-width="2"/>
  <text x="1006" y="576" class="boxTitle">10. Permissions</text>
  <text x="1006" y="600" class="boxText">Who can do what?</text>
  <text x="1006" y="624" class="mono">permissions.py</text>
  <text x="1006" y="644" class="small">IsCollecteur, IsDirection, IsChefPanel...</text>

  <!-- backend arrows -->
  <line x1="952" y1="462" x2="973" y2="462" stroke="#38835A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1100 520 C1100 535 834 535 834 546" fill="none" stroke="#38835A" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M952 610 C965 610 965 610 973 610" fill="none" stroke="#38835A" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- database -->
  <rect x="255" y="805" width="790" height="82" rx="20" fill="#1A2E1F"/>
  <text x="285" y="838" class="whiteTitle">PostgreSQL Database</text>
  <text x="285" y="864" class="whiteText">Stores users, samples, evaluations, lab analyses, sessions, notifications, messages, suppliers.</text>
  <text x="875" y="864" class="whiteText">Access only through Django.</text>

  <line x1="834" y1="673" x2="834" y2="795" stroke="#38835A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="795" y1="805" x2="795" y2="683" stroke="#2E6F9F" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="852" y="745" class="small">ORM queries</text>
  <text x="704" y="745" class="small">data rows</text>

  <!-- concrete example -->
  <rect x="55" y="775" width="170" height="112" rx="16" fill="#FFFFFF" stroke="#D9DFD8"/>
  <text x="75" y="805" class="boxTitle">Concrete example</text>
  <text x="75" y="830" class="small">Collector adds sample:</text>
  <text x="75" y="852" class="mono">MesEchantillonsPage</text>
  <text x="75" y="872" class="mono">-> Service</text>
  <text x="75" y="892" class="mono">-> POST /api/echantillons/</text>

  <rect x="1075" y="775" width="170" height="112" rx="16" fill="#FFFFFF" stroke="#D9DFD8"/>
  <text x="1095" y="805" class="boxTitle">Another example</text>
  <text x="1095" y="830" class="small">User logs in:</text>
  <text x="1095" y="852" class="mono">LoginPage</text>
  <text x="1095" y="872" class="mono">-> AuthService</text>
  <text x="1095" y="892" class="mono">-> POST /api/auth/login/</text>

  <!-- legend -->
  <rect x="945" y="105" width="300" height="62" rx="15" fill="#FFFFFF" stroke="#D9DFD8"/>
  <line x1="965" y1="128" x2="1015" y2="128" stroke="#38835A" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1030" y="133" class="small">request / action goes forward</text>
  <line x1="965" y1="150" x2="1015" y2="150" stroke="#2E6F9F" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1030" y="155" class="small">response / saved data comes back</text>
</svg>
